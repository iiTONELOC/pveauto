[package]
name = "pveauto"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Library and command-line tool that downloads and verifies Proxmox Virtual Environment ISO images"
authors = ["Anthony Tropeano <anthonytropeano@me.com>"]
repository = "https://github.com/iiTONELOC/pveauto"

[dependencies]
oxdl = "0.2.0"
regex = "1.12.2"
reqwest = { version = "0.12.25", default-features = false, features = ["rustls-tls", "http2", "charset"] }
scraper = "0.25.0"
serde = { version = "1.0.228", features = ["derive"] }
sshkeys = "0.3.4"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
toml = "0.9.10"

[dev-dependencies]
tempfile = "3.23.0"

[lib]
doctest = false

[features]
server = []
iso-scraper-tests = []
iso-download-tests = []
iso-tests = ["iso-scraper-tests", "iso-download-tests"]
